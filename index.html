<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeartOnMe</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="images/app-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="css/webflow-style.css" />
  <style>
    :root{--pink:#fd6579;--pink-light:#ff8fa0;--bg:#f3f2f8;--text-dark:#1f1730;--text-mid:#6c6778;--grad:linear-gradient(135deg,#fd6579 0%,#ff8fa0 100%);}
    /* Navbar */
    .navbar.w-nav{background:#fff!important;box-shadow:0 2px 16px rgba(253,101,121,.07)!important;border-bottom:1px solid rgba(253,101,121,.09)!important;font-family:'Plus Jakarta Sans','Inter',sans-serif!important;}
    /* Brand */
    .brand{text-decoration:none!important;display:flex!important;align-items:center!important;}
    .brand-text{font-size:1.35rem!important;font-weight:800!important;background:var(--grad)!important;-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;background-clip:text!important;letter-spacing:-.5px!important;}
    /* Nav links */
    .w-nav-link{font-family:'Plus Jakarta Sans','Inter',sans-serif!important;font-weight:500!important;font-size:.88rem!important;color:var(--text-mid)!important;padding:7px 13px!important;border-radius:8px!important;transition:color .2s,background .2s!important;}
    .w-nav-link:hover,.w-nav-link.w--current,.w-nav-link.active{color:var(--pink)!important;background:rgba(253,101,121,.06)!important;}
    /* Coming Soon button */
    .button.w-button{background:var(--grad)!important;color:#fff!important;border-radius:50px!important;font-weight:700!important;font-size:.88rem!important;padding:9px 20px!important;box-shadow:0 3px 14px rgba(253,101,121,.35)!important;border:none!important;}


    /* Brand in top-left corner */
    .navbar .container.w-container{display:flex!important;align-items:center!important;gap:24px;padding-left:5%!important;padding-right:5%!important;max-width:none!important;}
    .navbar .container.w-container::before,.navbar .container.w-container::after{display:none!important;}
    .navbar .brand{float:none!important;flex-shrink:0;padding:0!important;}
    .navbar .w-nav-menu{flex:1;float:none!important;}
    .navbar .w-nav-button{margin-left:auto;float:none!important;}
    /* Mobile menu (replaces Webflow JS) */
    .navbar.w-nav{position:relative;z-index:100;}
    .w-nav-button{cursor:pointer;user-select:none;}
    @media screen and (max-width:991px){
      .navbar.nav-open .w-nav-menu{display:flex!important;flex-direction:column;align-items:stretch;gap:4px;
        position:absolute;top:100%;left:0;right:0;background:#fff;padding:12px 5% 18px;
        box-shadow:0 12px 24px rgba(31,23,48,.08);}
      .navbar.nav-open .w-nav-menu .w-nav-link{display:block;}
      .navbar.nav-open .w-nav-menu .button{align-self:center;margin-top:6px;}
      .navbar.nav-open .w-nav-button{background:rgba(253,101,121,.08);border-radius:8px;}
    }
  </style>
  <script>document.documentElement.className+=' w-mod-js'+(('ontouchstart' in window)?' w-mod-touch':'');</script>
<style>
  :root {
    --pink:      #fd6579;
    --pink-light:#ff8fa0;
    --bg:        #f3f2f8;
    --text-dark: #1f1730;
    --text-mid:  #6c6778;
    --text-light:#a09aaa;
    --grad:      linear-gradient(135deg,#fd6579 0%,#ff8fa0 100%);
    --shadow:    0 4px 20px rgba(253,101,121,.14);
    --r:         14px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans','Inter',sans-serif;background:var(--bg);color:var(--text-dark);}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* HOME LAYOUT */
  html,body{height:100%;}
  body{background:#fdf7f9;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
  body > .navbar,body > .page-footer{flex-shrink:0;}
  .home-wrap{
    position:relative;overflow:hidden;isolation:isolate;
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2vh 5% 9vh;
    background:radial-gradient(ellipse at 50% 35%,#fffafc 0%,#fdf2f5 70%);
  }
  .hero-content{position:relative;z-index:2;max-width:760px;}

  .logo-mark{width:clamp(56px,min(9vw,12vh),118px);height:auto;display:block;margin:0 auto 6px;animation:floatY 5s ease-in-out infinite;}
  .wordmark{font-size:clamp(1.15rem,min(2.4vw,3.4vh),2rem);font-weight:700;letter-spacing:-.5px;color:var(--text-dark);margin-bottom:clamp(10px,4.5vh,52px);}
  .wordmark span{color:var(--pink);}

  h1{font-size:clamp(1.9rem,min(6vw,8.2vh),4.6rem);font-weight:800;line-height:1.02;letter-spacing:-.04em;margin-bottom:clamp(10px,2.6vh,22px);}
  h1 .hl{display:block;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;padding-bottom:.08em;}
  .hero-sub{font-size:clamp(.92rem,min(1.5vw,2.1vh),1.2rem);line-height:1.55;color:var(--text-mid);max-width:25em;margin:0 auto clamp(14px,3.6vh,32px);}
  .btn-primary{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--grad);color:#fff;padding:clamp(11px,2vh,16px) 48px;border-radius:50px;
    font-weight:700;font-size:1.05rem;border:none;cursor:pointer;font-family:inherit;
    box-shadow:0 12px 30px rgba(253,101,121,.32);transition:transform .2s,box-shadow .2s;
    text-decoration:none;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(253,101,121,.42);}

  /* BACKGROUND DECOR */
  .bg-waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;z-index:0;pointer-events:none;}
  .bg-line{position:absolute;top:6%;right:-6%;width:min(46vw,620px);height:auto;z-index:0;pointer-events:none;opacity:.9;}
  .float-heart{position:absolute;z-index:1;color:#f7a9b6;opacity:.75;animation:floatY 4s ease-in-out infinite;pointer-events:none;}
  .float-heart svg{display:block;width:100%;height:auto;}
  .fh1{width:34px;top:30%;left:18%;}
  .fh2{width:30px;top:66%;right:20%;animation-delay:-2s;}
  .fh3{width:16px;top:18%;right:30%;opacity:.45;animation-delay:-1s;}

  /* FOOTER */
  .page-footer{
    text-align:center;font-size:.74rem;color:var(--text-light);
    padding:10px 5%;background:#fbe9ee;position:relative;
  }
  .page-footer a{color:var(--pink);text-decoration:none;}

  @media(max-width:780px){
    .home-wrap{padding:2vh 6% 8vh;}
    .fh1{left:6%;top:24%;}
    .fh2{right:8%;top:74%;}
    .bg-line{width:80vw;right:-30%;}
    .btn-primary{padding:clamp(11px,1.8vh,14px) 40px;}
  }
  @media(max-height:480px){body{height:auto;min-height:100vh;overflow:auto;}.home-wrap{padding:24px 5% 70px;}}
  @media(prefers-reduced-motion:reduce){.logo-mark,.float-heart{animation:none;}}
</style>
</head>
<body class="body">
<div data-collapse="medium"
  role="banner" class="navbar w-nav">
  <div class="container w-container">
    <a href="index.html" class="brand w-nav-brand" aria-label="HeartOnMe home"><span class="brand-text">HeartOnMe</span></a>
    <nav role="navigation" class="nav-menu w-nav-menu">
			<a href="index.html" class="nav-link w-nav-link active" aria-current="page">Home</a>
			<a href="about.html" class="nav-link-2 w-nav-link">About</a>
      <a href="contact.html" class="nav-link-3 w-nav-link">Contact</a>
			<a href="help.html" class="nav-link-4 w-nav-link">Help</a>
			<a href="age-policy.html" class="nav-link-5 w-nav-link">Age Policy</a>
			<a href="#" class="button w-button">Coming Soon ✨</a>
		</nav>
    <div class="menu-button w-nav-button">
      <div class="icon-2 w-icon-nav-menu"></div>
    </div>
  </div>
</div>

<main class="home-wrap">
    <svg class="bg-line" viewBox="0 0 600 600" fill="none" aria-hidden="true">
      <path d="M560 40C430-10 300 60 330 190c18 78 120 96 160 170 46 86-20 190-150 220" stroke="#f6c9d2" stroke-width="2"/>
      <path d="M600 120C500 90 420 150 440 240c14 64 90 90 110 150" stroke="#f9dbe1" stroke-width="2"/>
    </svg>
    <svg class="bg-waves" viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 120C240 40 420 150 720 210s520 20 720-60V400H0z" fill="#fbe3e9"/>
      <path d="M0 230C260 170 470 300 760 300s470-90 680-70V400H0z" fill="#f9d5de"/>
      <path d="M0 320c300-50 520 40 820 30s420-60 620-40V400H0z" fill="#fbe9ee"/>
    </svg>
    <span class="float-heart fh1"><svg viewBox="0 0 24 22" aria-hidden="true"><path fill="currentColor" d="M12 21s-8.5-5.2-10.6-10.4C-.1 6.6 2.3 2 6.6 2 9 2 10.9 3.4 12 5.2 13.1 3.4 15 2 17.4 2c4.3 0 6.7 4.6 5.2 8.6C20.5 15.8 12 21 12 21z"/></svg></span>
    <span class="float-heart fh2"><svg viewBox="0 0 24 22" aria-hidden="true"><path fill="currentColor" d="M12 21s-8.5-5.2-10.6-10.4C-.1 6.6 2.3 2 6.6 2 9 2 10.9 3.4 12 5.2 13.1 3.4 15 2 17.4 2c4.3 0 6.7 4.6 5.2 8.6C20.5 15.8 12 21 12 21z"/></svg></span>
    <span class="float-heart fh3"><svg viewBox="0 0 24 22" aria-hidden="true"><path fill="currentColor" d="M12 21s-8.5-5.2-10.6-10.4C-.1 6.6 2.3 2 6.6 2 9 2 10.9 3.4 12 5.2 13.1 3.4 15 2 17.4 2c4.3 0 6.7 4.6 5.2 8.6C20.5 15.8 12 21 12 21z"/></svg></span>

    <div class="hero-content">
      <svg class="logo-mark" viewBox="0 0 120 100" fill="none" role="img" aria-label="HeartOnMe logo">
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fd6579"/><stop offset="1" stop-color="#ff8fa0"/></linearGradient>
        </defs>
        <path d="M60 90C24 66 9 48 9 31 9 17 20 7 33 7c11 0 20 7 27 18" stroke="url(#lg1)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M60 25c7-11 16-18 27-18 13 0 24 10 24 24 0 17-15 35-51 59" stroke="url(#lg1)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
      </svg>
      <div class="wordmark">Heart<span>OnMe</span></div>
      <h1>Real People.<span class="hl">Meaningful Dates.</span></h1>
      <p class="hero-sub">Meet in real life, create genuine connections and make every date count.</p>
      <a href="#" class="btn-primary">Coming Soon</a>
    </div>
  </main>
  <div class="page-footer">© 2026 HeartOnMe. All Rights Reserved.</div>

<script>
  (function(){
    var nav=document.querySelector('.navbar'),btn=nav&&nav.querySelector('.w-nav-button');
    if(!btn)return;
    btn.setAttribute('role','button');btn.setAttribute('tabindex','0');btn.setAttribute('aria-label','Menu');
    function t(){var o=nav.classList.toggle('nav-open');btn.setAttribute('aria-expanded',o);}
    btn.addEventListener('click',t);
    btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();t();}});
  })();
</script>
</body>
</html>
